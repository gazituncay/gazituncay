<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Gazi Tuncay — full-stack developer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb547"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb547" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="998" height="268" rx="16"/>
    </clipPath>
    <clipPath id="type">
      <rect x="48" y="170" height="40" width="0">
        <animate attributeName="width" from="0" to="770" begin="0.6s" dur="2.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="270" fill="#0b0f17"/>
    <rect x="560" width="440" height="270" fill="url(#dots)"/>
    <rect width="1000" height="270" fill="url(#glow)"/>

    <!-- window bar -->
    <rect width="1000" height="44" fill="#11161f"/>
    <rect y="44" width="1000" height="1" fill="#1f2630"/>
    <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="22" r="6" fill="#febc2e"/>
    <circle cx="66" cy="22" r="6" fill="#28c840"/>
    <text x="500" y="27" text-anchor="middle" class="mono" font-size="13" fill="#6e7681">~/gazituncay — zsh</text>

    <!-- prompt -->
    <text x="48" y="90" class="mono fade d1" font-size="18" fill="#7ee787">➜ <tspan fill="#79c0ff">~</tspan> <tspan fill="#c9d1d9">whoami</tspan></text>

    <!-- name -->
    <text x="46" y="148" class="sans fade d2" font-size="54" font-weight="800" fill="#f0f6fc" letter-spacing="-1">Gazi Tuncay</text>

    <!-- typed subtitle -->
    <g clip-path="url(#type)">
      <text x="48" y="196" class="mono" font-size="20" fill="#8b949e" textLength="770" lengthAdjust="spacingAndGlyphs">full-stack developer · web platforms, game servers &amp; AI tools</text>
    </g>
    <rect x="48" y="179" width="11" height="22" fill="#ffb547">
      <animate attributeName="x" from="48" to="824" begin="0.6s" dur="2.6s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- accent line -->
    <rect y="264" width="1000" height="6" fill="url(#accent)"/>
  </g>
  <rect x="1" y="1" width="998" height="268" rx="16" fill="none" stroke="#21262d" stroke-width="2"/>
</svg>
